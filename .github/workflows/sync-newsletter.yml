name: Sync Dunya post previews

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Refresh public Substack excerpts
        run: node scripts/sync-substack.mjs

      - name: Publish changed post data
        shell: bash
        run: |
          if git diff --quiet -- assets/data/newsletter-posts.json; then
            echo "No newsletter changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/newsletter-posts.json
          git commit -m "Sync Dunya post previews"
          git push
