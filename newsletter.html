<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Balls | Samatar Elmi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        .main-content { 
            padding: 100px 10% 100px;
            max-width: 900px; 
            margin: 0 auto; 
            text-align: center;
        }

        .title-large { 
            font-size: 3.5rem; 
            font-weight: 300; 
            letter-spacing: -1px; 
            margin-bottom: 20px; 
            font-family: 'Playfair Display', serif;
        }

        .subtitle { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: #d4af37; 
            margin-bottom: 80px; 
            display: block;
        }

        .description { 
            font-size: 1.2rem; 
            line-height: 1.8; 
            color: #444; 
            margin-bottom: 60px; 
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .recent-posts {
            margin: 60px auto 60px;
            max-width: 600px;
            text-align: left;
        }

        .recent-posts-heading {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4af37;
            margin-bottom: 30px;
            text-align: center;
        }

        .post-item {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item a {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: #1a1a1a;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            transition: color 0.3s;
        }

        .post-item a:hover {
            color: #d4af37;
        }

        .post-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #999;
            text-transform: uppercase;
        }

        .subscribe-wrapper {
            margin: 20px auto 0;
            display: flex;
            justify-content: center;
        }

        .subscribe-wrapper iframe {
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .title-large { font-size: 2.5rem; }
            .main-content { padding-top: 60px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">SAMATAR ELMI</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="writing.html">Writing</a>
            <a href="music.html">Music</a>
            <a href="gallery.html">Gallery</a>
            <a href="graft.html">Graft</a>
            <a href="hilaac.html">Hilaac</a>
            <a href="reviews.html">Reviews</a>
            <a href="newsletter.html">Newsletter</a>
        </div>
    </nav>

    <main class="main-content">
        <span class="subtitle">The Dispatch</span>
        <h1 class="title-large">Crystal Balls</h1>
        <p class="description">
            Occasional dispatches on poetry, archetypes, and the creative process. <br>
            A space for the research that lives between the lines.
        </p>

        <!-- Subscribe Embed -->
        <div class="subscribe-wrapper">
            <iframe
                src="https://samatarelmi.substack.com/embed"
                width="480"
                height="320"
                style="border: 1px solid #EEE; background: white"
                frameborder="0"
                scrolling="no">
            </iframe>
        </div>

        <!-- Recent Posts -->
        <div class="recent-posts">
            <p class="recent-posts-heading">Recent Dispatches</p>
            <div id="substack-posts"></div>
        </div>

    </main>

    <script>
        const RSS_URL = `https://api.rss2json.com/v1/api.json?rss_url=https://samatarelmi.substack.com/feed`;

        fetch(RSS_URL)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('substack-posts');
                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<p style="color:#999; font-family: Montserrat, sans-serif; font-size: 0.8rem; letter-spacing:2px;">No posts yet.</p>';
                    return;
                }
                data.items.slice(0, 5).forEach(post => {
                    const date = new Date(post.pubDate).toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
                    container.innerHTML += `
                        <div class="post-item">
                            <a href="${post.link}" target="_blank">${post.title}</a>
                            <span class="post-date">${date}</span>
                        </div>`;
                });
            })
            .catch(() => {
                document.getElementById('substack-posts').innerHTML = '';
            });
    </script>

</body>
</html>
