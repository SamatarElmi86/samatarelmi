<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Samatar Elmi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .gallery-container { width: 100%; display: flex; justify-content: center; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 75%;
            gap: 0;
        }

        .album-box {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
        }

        .album-box img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.5s ease;
        }

        .album-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            opacity: 0; visibility: hidden; z-index: 10;
            transition: all 0.4s ease;
        }

        .album-box:hover .album-overlay { opacity: 1; visibility: visible; }
        .album-box:hover img { transform: scale(1.05); opacity: 0.3; }

        .album-overlay h3 {
            font-family: 'Montserrat', sans-serif; color: #d4af37;
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 3px;
            margin-bottom: 5px;
        }
        .album-overlay p { font-size: 0.8rem; color: #666; font-style: italic; }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active { display: flex; }

        .lightbox-media {
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-media img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-media iframe,
        .lightbox-media video {
            width: 85vw;
            max-width: 960px;
            height: calc(85vw * 9 / 16);
            max-height: 85vh;
            display: block;
            border: none;
        }

        .lightbox-close {
            position: absolute;
            top: 24px; right: 32px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
            background: none;
            border: none;
        }

        .lightbox-close:hover { opacity: 1; }

        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: none; border: none;
            color: #fff; font-size: 1.8rem;
            cursor: pointer; opacity: 0.4;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover { opacity: 1; }

        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }

        .lightbox-counter {
            position: absolute;
            bottom: 24px; left: 50%; transform: translateX(-50%);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem; letter-spacing: 3px;
            color: #fff; opacity: 0.4;
        }

        @media (max-width: 1000px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); width: 100%; } }
        @media (max-width: 600px) { .gallery-grid { grid-template-columns: 1fr; width: 100%; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">SAMATAR ELMI</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="writing.html">Writing</a>
            <a href="music.html">Music</a>
            <a href="gallery.html">Gallery</a>
            <a href="graft.html">Graft</a>
            <a href="hilaac.html">Hilaac</a>
            <a href="reviews.html">Reviews</a>
            <a href="newsletter.html">Newsletter</a>
        </div>
    </nav>

    <main class="gallery-container">
        <div class="gallery-grid">

            <div class="album-box" onclick="openLightbox('performances', 0)">
                <img src="P01.jpg" alt="Performances">
                <div class="album-overlay">
                    <h3>Performances</h3>
                    <p>Live at Latitude & more</p>
                </div>
            </div>

            <div class="album-box" onclick="openLightbox('process', 0)">
                <img src="C01.jpg" alt="Creative Process">
                <div class="album-overlay">
                    <h3>Creative Process</h3>
                    <p>Studio & Archive</p>
                </div>
            </div>

            <div class="album-box" onclick="openLightbox('portraits', 0)">
                <img src="PR01.jpg" alt="Portraits">
                <div class="album-overlay">
                    <h3>Portraits</h3>
                    <p>Press & Editorial</p>
                </div>
            </div>

            <div class="album-box" onclick="openLightbox('installations', 0)">
                <img src="I01.jpg" alt="Installations">
                <div class="album-overlay">
                    <h3>Installations</h3>
                    <p>DIY Multi-media</p>
                </div>
            </div>

            <div class="album-box" onclick="openLightbox('analog', 0)">
                <img src="A01.JPG" alt="Analog">
                <div class="album-overlay">
                    <h3>Analog</h3>
                    <p>Field notes</p>
                </div>
            </div>

            <div class="album-box" onclick="openLightbox('collaborations', 0)">
                <img src="CO01.jpg" alt="Collaborations">
                <div class="album-overlay">
                    <h3>Collaborations</h3>
                    <p>With Jamie Smith & others</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">Close</button>
        <button class="lightbox-prev" onclick="changeMedia(-1)">&#8592;</button>
        <div class="lightbox-media" id="lightbox-media"></div>
        <button class="lightbox-next" onclick="changeMedia(1)">&#8594;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script>
        const galleries = {

            performances: [
                { type: 'image',   src: 'P01.jpg' },
                { type: 'image',   src: 'P02.jpg' },
                // add more...
            ],

            process: [
                { type: 'image', src: 'C01.jpg' },
                { type: 'image', src: 'C02.jpg' },
                // add more...
            ],

            portraits: [
                { type: 'image', src: 'PR01.jpg' },
                { type: 'image', src: 'PR02.jpg' },
                // add more...
            ],

            installations: [
                { type: 'image', src: 'I01.jpg' },
                // add more...
            ],

            analog: [
                { type: 'image', src: 'A01.JPG' },
                { type: 'image', src: 'A02.JPG' },
                { type: 'image', src: 'A03.JPG' },
                { type: 'image', src: 'A04.JPG' },
                { type: 'image', src: 'A05.JPG' },
                { type: 'image', src: 'A06.JPG' },
                { type: 'image', src: 'A07.JPG' },
                { type: 'image', src: 'A08.JPG' },
                { type: 'image', src: 'A09.JPG' },
                { type: 'image', src: 'A10.JPG' },
                { type: 'image', src: 'A11.JPG' },
                { type: 'image', src: 'A12.JPG' },
                { type: 'image', src: 'A13.JPG' },
                { type: 'image', src: 'A14.JPG' },
                { type: 'image', src: 'A15.JPG' },
                { type: 'image', src: 'A16.JPG' },
                { type: 'image', src: 'A17.JPG' },
                { type: 'image', src: 'A18.JPG' },
                { type: 'image', src: 'A19.JPG' },
                { type: 'image', src: 'A20.JPG' },
                { type: 'image', src: 'A21.JPG' },
            ],

            collaborations: [
                { type: 'image', src: 'CO01.jpg' },
                // add more...
            ],

        };

        let currentGallery = [];
        let currentIndex = 0;

        function openLightbox(galleryName, index) {
            currentGallery = galleries[galleryName];
            currentIndex = index;
            renderMedia();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightbox-media').innerHTML = '';
            document.body.style.overflow = '';
        }

        function changeMedia(direction) {
            currentIndex = (currentIndex + direction + currentGallery.length) % currentGallery.length;
            renderMedia();
        }

        function renderMedia() {
            const item = currentGallery[currentIndex];
            const container = document.getElementById('lightbox-media');
            container.innerHTML = '';

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = '';
                container.appendChild(img);

            } else if (item.type === 'youtube') {
                const iframe = document.createElement('iframe');
                iframe.src = `https://www.youtube.com/embed/${item.src}?autoplay=1`;
                iframe.allow = 'autoplay; fullscreen';
                iframe.allowFullscreen = true;
                container.appendChild(iframe);

            } else if (item.type === 'vimeo') {
                const iframe = document.createElement('iframe');
                iframe.src = `https://player.vimeo.com/video/${item.src}?autoplay=1`;
                iframe.allow = 'autoplay; fullscreen';
                iframe.allowFullscreen = true;
                container.appendChild(iframe);

            } else if (item.type === 'mp4') {
                const video = document.createElement('video');
                video.src = item.src;
                video.controls = true;
                video.autoplay = true;
                container.appendChild(video);
            }

            document.getElementById('lightbox-counter').textContent =
                (currentIndex + 1) + ' / ' + currentGallery.length;
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'ArrowRight') changeMedia(1);
            if (e.key === 'ArrowLeft') changeMedia(-1);
            if (e.key === 'Escape') closeLightbox();
        });

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
    </script>

</body>
</html>
